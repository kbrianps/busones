<canvas id="mapa" aria-label="Mapa dos ônibus"></canvas>
<div id="atrib">&copy; OpenStreetMap · Protomaps · dados SMTR</div>

<header id="topo">
  <div id="barra">
    <button id="barra-icone" class="barra-icone" aria-label="Buscar linha"><svg><use href="#i-bus"/></svg></button>
    <input id="campo" type="search" placeholder="Qual linha procura?" autocomplete="off" aria-label="Qual linha procura?">
    <button id="onde" aria-label="Onde você está"><svg><use href="#i-pino"/></svg><span id="onde-txt">Rio de Janeiro</span></button>
    <button id="lupa" aria-label="Buscar"><svg><use href="#i-busca"/></svg></button>
  </div>
  <div id="sugestoes" hidden></div>
</header>

<nav id="trilho" aria-label="Linhas que você acompanha"></nav>

<button id="engrenagem" class="fab branco pequeno" aria-label="Ajustes"><svg><use href="#i-engrenagem"/></svg></button>

<div id="fabs">
  <button id="fab-local" class="fab branco" aria-label="Centralizar em mim"><svg><use href="#i-local"/></svg></button>
</div>

<section id="folha" hidden aria-label="Horários dos ônibus">
  <div id="pega"></div>
  <div id="folha-conteudo"></div>
</section>

<div id="balao" hidden></div>

<section id="local" hidden aria-label="Onde você está">
  <div class="local-topo">
    <h2>Onde você está?</h2>
    <button id="local-fechar" class="folha-fechar" aria-label="Fechar"><svg><use href="#i-fechar"/></svg></button>
  </div>
  <input id="local-campo" type="search" placeholder="Bairro ou parada" autocomplete="off" aria-label="Bairro ou parada">
  <div id="local-lista"></div>
</section>

<div id="escolha" hidden>
  <p>Arraste o mapa até onde você está</p>
  <div class="escolha-botoes">
    <button id="escolha-cancelar">Cancelar</button>
    <button id="escolha-ok" class="primario">Estou aqui</button>
  </div>
</div>

<section id="ajustes" hidden aria-label="Ajustes">
  <header class="ajustes-topo">
    <button id="ajustes-voltar" aria-label="Voltar"><svg><use href="#i-voltar"/></svg></button>
    <h1>Ajustes</h1>
  </header>
  <div id="ajustes-lista"></div>
</section>

<script src="map.js"></script>
<script src="app.js"></script>
<script>ligaMapa(); inicia();</script>
